[project]
name = "garmin-runs"
version = "0.1.0"
description = "Pull Garmin Connect data via the Personal API, analyze runs, and build a route heatmap."
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python",
    "fitdecode",
    "pandas",
    "pyarrow",
    "folium",
    "plotly",
]

[project.scripts]
garmin-runs = "garmin_runs.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/garmin_runs"]
