[project]
name = "cafe-tolerance"
version = "0.1.0"
description = "GD&T-style tolerance analysis of my runs past Toronto cafes, computed in C++/WebAssembly."
requires-python = ">=3.12"
dependencies = [
    "garmin-connect-personal-api-python",
    "fitdecode",
    "numpy",
    "pandas",
    "pyarrow",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
]

[project.scripts]
cafe-tolerance = "cafe_tolerance.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cafe_tolerance"]
